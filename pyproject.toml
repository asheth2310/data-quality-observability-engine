[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-engine"
version = "0.1.0"
description = "A production-grade data quality and observability engine for monitoring data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.104.1",
    "pydantic==2.5.2",
    "scipy==1.11.4",
    "numpy==1.26.2",
    "neo4j==5.15.0",
    "psycopg[binary]==3.1.14",
    "redis==5.0.1",
    "confluent-kafka==2.3.0",
    "celery==5.3.6",
    "uvicorn==0.24.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.92.1",
    "httpx==0.25.2",
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "property: marks property-based tests (deselect with '-m \"not property\"')",
    "integration: marks integration tests requiring external services",
]

[tool.hypothesis]
max_examples = 100
deadline = 5000
